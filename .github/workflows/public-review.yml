name: Public review example
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-and-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test chronology, matched scoring and recovery
        run: python -m unittest discover -s examples/review_lab/tests -v
      - name: Test basketball identities and information-time contracts
        run: |
          python -m unittest discover -s examples/basketball_contracts/tests -v
          python -m examples.basketball_contracts --output "${RUNNER_TEMP}/basketball-contracts.json"
          python -m examples.basketball_contracts.evidence --check-results
          python -m examples.basketball_contracts.evidence_market_coverage --check
      - name: Run and reuse the synthetic example
        shell: bash
        run: |
          python -m examples.review_lab --output "${RUNNER_TEMP}/sports-edge-review"
          python -m examples.review_lab --output "${RUNNER_TEMP}/sports-edge-review"
      - name: Check generated evidence page
        run: python -m examples.review_lab.build_review --check
      - name: Check current aggregate review and decision boundaries
        run: |
          python -m examples.review_lab.build_current_review --check
          python -m examples.review_lab.historical_selection
          python -m examples.review_lab.decision_replay
          python -m examples.review_lab.serving_lineage
          python -m examples.review_lab.portfolio_evidence
          python -m examples.review_lab.prospective_state
          python -m examples.review_lab.numerical_recovery
      - name: Demonstrate scoped multi-parent recovery
        run: python -m examples.review_lab.provenance
      - name: Check every public evidence selector state
        run: |
          node examples/review_lab/tests/test_selectors.cjs
          node examples/review_lab/tests/test_current_selectors.cjs
  executed-notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned public notebook dependencies
        run: python -m pip install -r examples/basketball_contracts/notebook-requirements.txt
      - name: Execute and validate persisted rich notebook outputs
        run: python -m examples.review_lab.execute_notebook --mode kernel --output "${{ runner.temp }}/engineering-review.ipynb"
      - name: Execute and reopen basketball aggregate notebook
        run: python -m examples.basketball_contracts.execute_notebook --output "${{ runner.temp }}/basketball-review.ipynb"
      - name: Execute and reopen basketball MARKET coverage notebook
        run: python -m examples.basketball_contracts.execute_coverage_notebook --output "${{ runner.temp }}/basketball-market-coverage.ipynb"

