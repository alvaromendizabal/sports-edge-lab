name: FBS native prediction compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  named-predictions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        lightgbm-version: ['4.6.0', '4.7.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native compatibility dependencies
        run: python -m pip install 'numpy<3' 'pandas<3' 'scikit-learn>=1.6,<1.9' joblib 'lightgbm==${{ matrix.lightgbm-version }}'
      - name: Require native packages and execute the invented reproducer
        run: python -m examples.fbs_contracts.named_predictions
      - name: Test schema failures and cold prediction equality
        run: python -m unittest examples.fbs_contracts.tests.test_named_predictions -v
