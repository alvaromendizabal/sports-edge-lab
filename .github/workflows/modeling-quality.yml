name: Football modeling - offline scientific checks
on:
  push:
    branches: [main]
    paths:
      - 'modeling/football_v058/**'
      - 'modeling/football_v059/**'
      - 'modeling/football_v060/**'
      - 'modeling/football_v061/**'
      - 'modeling/football_v062/**'
      - 'modeling/football_v063/**'
      - 'modeling/football_v064/**'
      - '.github/workflows/modeling-quality.yml'
  pull_request:
    paths:
      - 'modeling/football_v058/**'
      - 'modeling/football_v059/**'
      - 'modeling/football_v060/**'
      - 'modeling/football_v061/**'
      - 'modeling/football_v062/**'
      - 'modeling/football_v063/**'
      - 'modeling/football_v064/**'
      - '.github/workflows/modeling-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-science:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modeling/football_v058/requirements.txt
      - name: Install pinned scientific dependencies
        run: python -m pip install -r modeling/football_v058/requirements.txt
      - name: Run offline unit and synthetic smoke tests
        run: python -m unittest discover -s modeling/football_v058 -p '*_tests.py' -v
      - name: Execute synthetic chronological demonstration
        run: python modeling/football_v058/run_demo.py --output /tmp/football_v058_demo.json
      - name: Verify honest demonstration contract
        run: |
          python - <<'PY'
          import json
          report = json.load(open('/tmp/football_v058_demo.json'))
          assert report['status'] == 'PASS'
          assert report['data_kind'] == 'entirely_synthetic'
          assert report['synthetic_fits'] == 9
          assert report['provider_calls'] == 0
          assert report['actual_football_performance'] is False
          assert report['private_aws_workflow_verified'] is False
          print('Nine synthetic fits and chronological gates completed.')
          PY

  offline-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modeling/football_v059/requirements.txt
      - name: Install pinned state-model dependencies
        run: python -m pip install -r modeling/football_v059/requirements.txt
      - name: Run offline state, scope and repair tests
        run: python -m unittest discover -s modeling/football_v059 -p '*_tests.py' -v
      - name: Execute synthetic joint-state demonstration
        run: python modeling/football_v059/run_demo.py --output /tmp/football_v059_demo.json
      - name: Verify honest state-demonstration contract
        run: |
          python - <<'PY'
          import json
          report = json.load(open('/tmp/football_v059_demo.json'))
          assert report['status'] == 'PASS'
          assert report['data_kind'] == 'entirely_synthetic'
          assert report['synthetic_joint_fits'] == 4
          assert report['provider_calls'] == 0
          assert report['actual_football_performance'] is False
          assert report['private_aws_workflow_verified'] is False
          assert report['v059_owner_run_completed'] is False
          print('Four synthetic joint fits and temporal/distribution checks completed.')
          PY

  offline-native-boosting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modeling/football_v060/requirements.txt
      - name: Install pinned CPU native-boosting dependencies
        run: python -m pip install -r modeling/football_v060/requirements.txt
      - name: Run twelve synthetic fits and public parser checks
        run: python -m unittest discover -s modeling/football_v060 -p '*_tests.py' -v


  offline-situation-features:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modeling/football_v061/requirements.txt
      - name: Install pinned feature-method dependencies
        run: python -m pip install -r modeling/football_v061/requirements.txt
      - name: Run 23 offline representation checks with no model fits
        run: python -m unittest discover -s modeling/football_v061 -p '*_tests.py' -v

  offline-objective-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modeling/football_v062/requirements.txt
      - name: Install pinned objective-method dependencies
        run: python -m pip install -r modeling/football_v062/requirements.txt
      - name: Run 23 offline objective checks and four tiny synthetic fits
        run: python -m unittest discover -s modeling/football_v062 -p '*_tests.py' -v

  offline-serving:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modeling/football_v063/requirements.txt
      - name: Install pinned existing-model serving dependencies
        run: python -m pip install -r modeling/football_v063/requirements.txt
      - name: Run 36 offline serving checks and four tiny synthetic estimator fits
        run: |
          python - <<'PY'
          import sys
          import unittest
          sys.path.insert(0, 'modeling/football_v063')
          import prospective_tests
          suite = unittest.defaultTestLoader.loadTestsFromModule(prospective_tests)
          assert suite.countTestCases() == 36
          assert prospective_tests.ProspectiveTests.synthetic_smoke_fits == 4
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  offline-feature-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modeling/football_v064/requirements.txt
      - name: Install pinned reconstruction and serving dependencies
        run: python -m pip install -r modeling/football_v064/requirements.txt
      - name: Run 69 offline checks and four tiny synthetic estimator fits
        run: |
          python - <<'PY'
          import sys
          import unittest
          sys.path.insert(0, 'modeling/football_v064')
          import fresh_feature_tests
          import prospective_tests
          reconstruction = unittest.defaultTestLoader.loadTestsFromModule(fresh_feature_tests)
          serving = unittest.defaultTestLoader.loadTestsFromModule(prospective_tests)
          assert reconstruction.countTestCases() == 26
          assert serving.countTestCases() == 43
          assert prospective_tests.ProspectiveTests.synthetic_smoke_fits == 4
          suite = unittest.TestSuite([reconstruction, serving])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
