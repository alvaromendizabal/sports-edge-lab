name: NFL N115 scientific return review
on:
  pull_request:
    paths: ['tracks/nfl/circa_million_2026/n115_current/**', 'tracks/nfl/circa_million_2026/test_n115_browser.cjs', '.github/workflows/nfl-n115-review.yml']
  push:
    branches: [main]
    paths: ['tracks/nfl/circa_million_2026/n115_current/**', 'tracks/nfl/circa_million_2026/test_n115_browser.cjs', '.github/workflows/nfl-n115-review.yml']
permissions:
  contents: read
concurrency:
  group: nfl-n115-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install verification browser
        run: |
          npm install --prefix "${RUNNER_TEMP}/n115-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "${RUNNER_TEMP}/n115-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify all repository views at desktop and mobile widths
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/n115-browser/node_modules/playwright
        run: |
          node tracks/nfl/circa_million_2026/test_n115_browser.cjs
      - name: Verify both published routes, retained source and private guards
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/n115-browser/node_modules/playwright
        run: NFL_N115_ONLINE_URL=https://sports-edge-lab-nfl.alv-mendizabal.chatgpt.site/circa/n115/ node tracks/nfl/circa_million_2026/test_n115_browser.cjs
