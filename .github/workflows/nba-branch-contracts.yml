name: NBA branch contracts
on:
  pull_request:
    paths:
      - 'examples/nba_branch/**'
      - 'tracks/nba/**'
      - 'docs/nba/**'
      - 'docs/NBA_RESEARCH_CARD.md'
      - 'docs/evidence/2026-10-29-nba-b009-audit.json'
      - '.github/workflows/nba-branch-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'examples/nba_branch/**'
      - 'tracks/nba/**'
      - 'docs/nba/**'
      - 'docs/NBA_RESEARCH_CARD.md'
      - 'docs/evidence/2026-10-29-nba-b009-audit.json'
      - '.github/workflows/nba-branch-contracts.yml'
permissions:
  contents: read
jobs:
  invented-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore exact full JSON from pinned lossless repository assets
        run: python tracks/nba/reports/restore_snapshot_assets.py
      - name: Test NBA scope, chronology, factorial cohorts and exact checkpoint reuse
        run: python -m unittest discover -s examples/nba_branch/tests -v
      - name: Execute invented contracts with zero real fits or provider requests
        run: python -m examples.nba_branch.contracts
      - name: Verify standalone NBA page agrees with sanitized evidence
        run: python -m examples.nba_branch.build_review --check
      - name: Test NBA evidence admission and partial-owner boundaries
        run: python -m unittest discover -s tracks/nba/public_monitor/tests -v
      - name: Execute the invented NBA monitor walkthrough
        run: python -m tracks.nba.public_monitor
      - name: Verify the dated NBA aggregate monitor
        run: python -m tracks.nba.public_monitor.build --check
      - name: Validate complete selected NBA research output coverage and clocks
        run: python tracks/nba/reports/validate_research_snapshot.py tracks/nba/reports/latest_research_outputs.json
      - name: Reject unsupported NBA status and source-clock substitutions
        run: python -m unittest discover -s tracks/nba/reports -p test_research_snapshot.py -v
      - name: Verify current B082 evidence and separate B083 engineering review
        run: |
          python tracks/nba/reports/build_execution_review.py --check
          python -m unittest discover -s tracks/nba/reports -p test_b083_html.py -v
          python -m unittest discover -s tracks/nba/reports -p test_snapshot_assets.py -v
          python tracks/nba/reports/build_model_review.py --check
          python tracks/nba/reports/build_cohort_leaders.py --check
          python -m unittest discover -s tracks/nba/reports -p test_cohort_leaders.py -v
          python -m unittest discover -s tracks/nba/reports -p test_execution_review.py -v
      - name: Test progressive-enhancement interaction logic
        run: node --test docs/nba/monitor.test.cjs

  offline-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore exact full JSON from pinned lossless repository assets
        run: python tracks/nba/reports/restore_snapshot_assets.py
      - name: Install the repository-established pinned browser dependency
        run: |
          npm install --prefix "${RUNNER_TEMP}/nba-monitor-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "${RUNNER_TEMP}/nba-monitor-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Render offline desktop/mobile evidence and exercise actual controls
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nba-monitor-browser/node_modules/playwright
          NBA_MONITOR_SCREENSHOTS: ${{ runner.temp }}/nba-monitor-screenshots
        run: node docs/nba/monitor.browser.cjs
      - name: Render selected research forecasts on desktop and mobile and reopen offline
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nba-monitor-browser/node_modules/playwright
          NBA_MONITOR_SCREENSHOTS: ${{ runner.temp }}/nba-monitor-screenshots
        run: node tracks/nba/reports/latest_research_outputs.browser.cjs
      - name: Render actual owner failure and replacement engineering evidence
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nba-monitor-browser/node_modules/playwright
          NBA_MONITOR_SCREENSHOTS: ${{ runner.temp }}/nba-monitor-screenshots
        run: node tracks/nba/reports/execution_review.browser.cjs
      - name: Preserve rendered review and bounded accessibility checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nba-monitor-browser-review
          path: ${{ runner.temp }}/nba-monitor-screenshots/*
          if-no-files-found: error
          retention-days: 14


