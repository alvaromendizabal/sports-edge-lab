name: FBS branch evidence and invented reproduction
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fbs-contracts:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check timing, population, content closure and fit reentry
        run: |
          python -m unittest discover -s examples/fbs_contracts/tests -v
          python tests/test_fbs_v054_public_evidence.py
          python tests/test_fbs_v071_public.py
          python tests/test_fbs_v072_public.py
          python tests/test_fbs_v074_public.py
          python tests/test_fbs_v075_public.py
          python tests/test_fbs_v076_public.py
          node tests/fbs_v054_public_view.test.cjs
      - name: Execute twice and verify deterministic evidence page
        run: |
          python -m examples.fbs_contracts --output "${RUNNER_TEMP}/fbs-review"
          python -m examples.fbs_contracts --output "${RUNNER_TEMP}/fbs-review"
          python -m examples.fbs_contracts.build_review --check
          python -m examples.fbs_contracts.build_recovery_review --check
          python -m examples.fbs_contracts.build_season_review --check
          node examples/fbs_contracts/tests/test_season_logic.cjs
          node --test examples/fbs_contracts/tests/test_source_progress.cjs
          node --test examples/fbs_contracts/tests/test_latest_available_logic.cjs
          python -m examples.fbs_contracts.export_site --commit "$(git rev-parse HEAD)" --output "${RUNNER_TEMP}/fbs-static-projection"
          python -m examples.fbs_contracts.certified_resume
      - name: Preserve the exact public static projection
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fbs-public-site-projection
          path: ${{ runner.temp }}/fbs-static-projection/
          if-no-files-found: error
          retention-days: 14
  fbs-notebook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned existing notebook dependencies
        run: python -m pip install -r examples/basketball_contracts/notebook-requirements.txt
      - name: Execute in a real kernel and reopen saved HTML outputs
        run: python -m examples.fbs_contracts.execute_notebook --output "${{ runner.temp }}/fbs-branch-review.ipynb"
  fbs-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned browser test dependency
        run: |
          npm install --prefix "${RUNNER_TEMP}/fbs-browser" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          # Ubuntu 24.04 already supplies the shared libraries used by these headless tests.
          # Avoid unrelated font downloads that exhausted the job before any assertion ran.
          node "${RUNNER_TEMP}/fbs-browser/node_modules/playwright/cli.js" install --only-shell chromium
      - name: Verify every aggregate selector, keyboard, mobile and download state
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/fbs-browser/node_modules/playwright
          FBS_SCREENSHOTS: ${{ runner.temp }}/fbs-screenshots
        run: |
          node examples/fbs_contracts/tests/test_dashboard_browser.cjs
          node examples/fbs_contracts/tests/test_recovery_browser.cjs
          node examples/fbs_contracts/tests/test_season_browser.cjs
          node tests/fbs_v054_browser.test.cjs
          node tests/fbs_v071_browser.test.cjs
          node tests/fbs_v072_browser.test.cjs
          node tests/fbs_v073_browser.test.cjs
          node tests/fbs_v074_browser.test.cjs
          node tests/fbs_v075_browser.test.cjs
          node tests/fbs_v076_browser.test.cjs
      - name: Verify the published V074 URL in an actual public browser
        if: github.event_name == 'pull_request' && github.head_ref == 'fbs/v074-saved-evidence-review'
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/fbs-browser/node_modules/playwright
          FBS_SCREENSHOTS: ${{ runner.temp }}/fbs-screenshots
          FBS_V074_LIVE_URL: https://sports-edge-lab-fbs.alv-mendizabal.chatgpt.site/v074/
        run: node tests/fbs_v074_browser.test.cjs
      - name: Verify the published V073 URL in an actual public browser
        if: github.event_name == 'pull_request' && github.head_ref == 'fbs/v073-v10-frozen-recovery'
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/fbs-browser/node_modules/playwright
          FBS_SCREENSHOTS: ${{ runner.temp }}/fbs-screenshots
          FBS_V073_LIVE_URL: https://sports-edge-lab-fbs.alv-mendizabal.chatgpt.site/v073/
        run: node tests/fbs_v073_browser.test.cjs
      - name: Preserve desktop and mobile evidence views
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fbs-evidence-screenshots
          path: |
            ${{ runner.temp }}/fbs-screenshots/*.png
            ${{ runner.temp }}/fbs-screenshots/FBS_V073_BROWSER_RECEIPT.json
            ${{ runner.temp }}/fbs-screenshots/FBS_V074_*_BROWSER_RECEIPT.json
            ${{ runner.temp }}/fbs-screenshots/FBS_V075_*_BROWSER_RECEIPT.json
            ${{ runner.temp }}/fbs-screenshots/FBS_V076_*_BROWSER_RECEIPT.json
          if-no-files-found: error
          retention-days: 14


