name: Sports Edge Lab - Ingestion Guardrails
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate-source-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile acquisition code
        run: python -m py_compile tools/acquire_public_assets.py
      - name: Run isolated source guards
        run: python tools/acquire_public_assets.py --self-test
      - name: Validate catalog scope and structure (offline)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('catalog/public_asset_manifest_20261015.json')
          catalog = json.loads(p.read_text())
          assert catalog['schema_version'] == 'nfl-edge-lab-public-assets-v1'
          assets = catalog['assets']
          assert len(assets) >= 800
          keys = [(a['source'], a['release_tag'], a['name']) for a in assets]
          assert len(set(keys)) == len(keys)
          assert any(a['release_tag'] == 'pbp' for a in assets)
          assert all(a['url'].startswith('https://') for a in assets)
          assert all(int(a['bytes']) >= 0 for a in assets)
          print('Public catalog guardrails passed:', len(assets), 'assets')
          PY
      - name: Compile shared acquisition utilities
        run: python -m py_compile tools/acquire_paid_data.py tools/test_paid_acquisition.py tools/consolidate_archive.py
      - name: Run paid acquisition safety and budget guards
        run: python tools/acquire_paid_data.py --self-test
      - name: Run offline paid acquisition integration checks
        run: python -m unittest discover -s tools -p 'test_paid_acquisition.py' -v
      - name: Validate the five sport tracks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('config/tracks.json').read_text())
          assert c['space'] == 'sports-edge-lab-dev'
          assert c['repository'] == 'alvaromendizabal/sports-edge-lab'
          assert {t['id'] for t in c['tracks']} == {'nfl', 'nba', 'ncaaf', 'ncaam', 'ncaaw'}
          assert len({t['odds_api_sport_key'] for t in c['tracks']}) == 5
          assert all(t['archive_prefix'] == 'tracks/' + t['id'] + '/' for t in c['tracks'])
          assert all(Path('tracks', t['id'], 'README.md').exists() for t in c['tracks'])
          print('Single-workspace five-sport configuration passed')
          PY
      - name: Run public archive and direct-source guards
        run: |
          python -m py_compile tools/acquire_public_archives.py tools/acquire_espn.py
          python tools/acquire_public_archives.py --self-test
          python tools/acquire_espn.py --self-test
      - name: Run historical player-prop audit and budget guards
        run: |
          python -m py_compile tools/acquire_player_props.py tools/history/acquire_paid_data_v001_launched.py
          python tools/acquire_player_props.py --self-test
      - name: Run targeted college shooting recovery guards
        run: |
          python -m py_compile tools/recover_shooting.py tools/history/acquire_public_archives_v007_launched.py
          python tools/recover_shooting.py --self-test
