name: Public repository source snapshot
on:
  push:
    branches: [maintenance/portfolio-sweep-20261019]
    paths: [.github/workflows/zz-sweep-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download only unauthenticated public repository source
        shell: python
        run: |
          import concurrent.futures, hashlib, json, os, pathlib, urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sweep';out.mkdir()
          names=['home-credit-model-stability','nfl-player-trajectory','jigsaw-rule-classifier','commodity-prediction','kaggriculture','lava-aws-multilingual-docvqa','biohub-cell-tracking-during-development','rsna-knee-abnormality-detection','otto-recommender-system','march-machine-learning-mania-2026','sports-edge-lab']
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'public-source-review','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=90) as r:return r.read()
          def collect(name):
              api=f'https://api.github.com/repos/alvaromendizabal/{name}'
              info=json.loads(get(api))
              if info['private']:raise RuntimeError('Only public repositories are authorized for this export')
              commit=json.loads(get(api+'/commits/main'));sha=commit['sha']
              runs=json.loads(get(api+f'/actions/runs?head_sha={sha}&event=push&per_page=100'))
              pulls=json.loads(get(api+'/pulls?state=open&per_page=100'))
              data=get(f'https://codeload.github.com/alvaromendizabal/{name}/zip/{sha}')
              (out/(name+'.zip')).write_bytes(data)
              row={'name':name,'sha':sha,'tree':commit['commit']['tree']['sha'],'description':info.get('description'),'homepage':info.get('homepage'),'topics':info.get('topics'),
                   'runs':[{'id':r['id'],'name':r['name'],'path':r['path'],'status':r['status'],'conclusion':r['conclusion'],'url':r['html_url']} for r in runs['workflow_runs']],
                   'open_prs':[{'number':p['number'],'title':p['title'],'head_sha':p['head']['sha'],'head':p['head']['ref'],'url':p['html_url']} for p in pulls],
                   'archive_sha256':hashlib.sha256(data).hexdigest(),'archive_bytes':len(data)}
              (out/(name+'.json')).write_text(json.dumps(row,indent=2));return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:rows=list(pool.map(collect,names))
          (out/'manifest.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eleven-public-repository-sources
          path: ${{ runner.temp }}/sweep/
          retention-days: 3
          if-no-files-found: error
