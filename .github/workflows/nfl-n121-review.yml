name: N121 isolated physical transport verification
on:
  push:
    branches: ['nfl/n121-physical-transport-proof']
permissions:
  contents: read
concurrency:
  group: nfl-n121-isolated-physical-transport
  cancel-in-progress: false
jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the exact released runner
        run: |
          python -I tracks/nfl/circa_million_2026/n121_current/runner_source/build.py "$RUNNER_TEMP/evidence-recovery.pyz"
          echo "72d84f2a5c8579f402417c5f6bc9f6791719f72eade0c20b8db7a5f63923cf5f  $RUNNER_TEMP/evidence-recovery.pyz" | sha256sum --check
          python -I -u "$RUNNER_TEMP/evidence-recovery.pyz" --self-test
      - name: Physical 512-MiB boundaries, multi-GiB, and rejection tests
        run: python -I -u tracks/nfl/test_n121_physical_transport.py "$RUNNER_TEMP/evidence-recovery.pyz" "$RUNNER_TEMP/physical-transport-receipt.json"
      - name: Save checked results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-n121-physical-transport-receipt
          path: ${{ runner.temp }}/physical-transport-receipt.json
          if-no-files-found: error
