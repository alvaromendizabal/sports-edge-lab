name: NFL N121 full-season review
on:
  pull_request:
    paths: ['tracks/nfl/circa_million_2026/n121_current/**', 'tracks/nfl/circa_million_2026/test_n121_browser.cjs', '.github/workflows/nfl-n121-review.yml']
  push:
    branches: [main]
    paths: ['tracks/nfl/circa_million_2026/n121_current/**', 'tracks/nfl/circa_million_2026/test_n121_browser.cjs', '.github/workflows/nfl-n121-review.yml']
permissions:
  contents: read
  pages: read
concurrency:
  group: nfl-n121-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify portable runner and archive recovery
        run: |
          echo '72d84f2a5c8579f402417c5f6bc9f6791719f72eade0c20b8db7a5f63923cf5f  tracks/nfl/circa_million_2026/n121_current/evidence-recovery.pyz' | sha256sum --check
          python -I -u tracks/nfl/circa_million_2026/n121_current/evidence-recovery.pyz --self-test
      - name: Identify existing repository publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{has_pages: .has_pages}'
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{status: .status, html_url: .html_url, build_type: .build_type, source: .source}'; then true; else echo 'Existing Pages deployment could not be confirmed.'; fi

      - name: Install pinned browser QA
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check dashboard, mobile layout, annual populations and disclosure boundaries
        run: node tracks/nfl/circa_million_2026/test_n121_browser.cjs
      - name: Save verified dashboard and public screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-n121-dashboard-review
          path: |
            artifacts/
            tracks/nfl/circa_million_2026/n121_current/index.html
