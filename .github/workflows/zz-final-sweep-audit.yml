name: Verify expanded portfolio source
on:
  push:
    branches: [maintenance/sweep-verification-20261019]
    paths: [.github/workflows/zz-final-sweep-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read public main archives and verify their embedded Git commit identities
        shell: python
        run: |
          import concurrent.futures,datetime,hashlib,io,json,os,pathlib,urllib.request,zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-sweep';out.mkdir()
          expected={
            'home-credit-model-stability':'1b1237cd5a94b2cafc02ba475322237540c1a048',
            'nfl-player-trajectory':'54e7b90e16f629e53c96014e873fd442f0c7002e',
            'jigsaw-rule-classifier':'1a0f72620d0035ef99b37c2c36a73332e3f310da',
            'commodity-prediction':'e745c0b57e23ad30ad17165e3e78af62a920f74c',
            'kaggriculture':'11983c216462761a02029cc5fdafff2b64c79e14',
            'lava-aws-multilingual-docvqa':'a1cf59ec04c92db4ab831c9bdd0421815dde8d05',
            'biohub-cell-tracking-during-development':'4775f710ab9385605d28cca4e8f137ebf7763995',
            'rsna-knee-abnormality-detection':'996cccf1addc0d297985e8570a13332ceb7e3928',
            'otto-recommender-system':'928c2c2e46566c9245252732f2b032ec39e826d2',
            'march-machine-learning-mania-2026':'ee47b1973f83e9d75cd273ba0872059808d41213',
            'sports-edge-lab':'4a4d0acee50958a24a665abc22ff86030966f285'}
          def collect(item):
              name,sha=item
              url=f'https://codeload.github.com/alvaromendizabal/{name}/zip/refs/heads/main'
              request=urllib.request.Request(url,headers={'User-Agent':'public-source-verification'})
              with urllib.request.urlopen(request,timeout=90) as r:raw=r.read()
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  actual=z.comment.decode('ascii')
                  if actual!=sha:raise RuntimeError(name+': main changed; reconcile')
                  if z.testzip() is not None:raise RuntimeError(name+': invalid archive')
                  files=[f for f in z.infolist() if not f.is_dir()]
                  paths=['/'.join(pathlib.PurePosixPath(f.filename).parts[1:]) for f in files]
                  bad=[p for p in paths if p.startswith('.github/workflows/zz-') or any(x.startswith('.cleanup') or x in {'__pycache__','.ipynb_checkpoints','node_modules','.venv'} for x in pathlib.PurePosixPath(p).parts) or p.endswith('.pyz') or ('_return_' in pathlib.PurePosixPath(p).name and p.endswith('.zip'))]
                  if bad:raise RuntimeError(name+': temporary files remain '+str(bad))
              (out/(name+'.zip')).write_bytes(raw)
              record={'name':name,'main_sha':actual,'file_count':len(files),'tracked_bytes':sum(f.file_size for f in files),
                  'archive_sha256':hashlib.sha256(raw).hexdigest(),'temporary_artifacts':[],'source':'current public main archive',
                  'workflow_verification':'performed separately through connected GitHub reads; not inferred from archive'}
              (out/(name+'.json')).write_text(json.dumps(record,indent=2));return record
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:records=list(pool.map(collect,expected.items()))
          result={'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'repositories':records}
          (out/'manifest.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-expanded-public-sweep
          path: ${{ runner.temp }}/verified-sweep/
          retention-days: 3
          if-no-files-found: error
