name: NFL online publication and archive review
on:
  pull_request:
    paths: ['tracks/nfl/**', '.github/workflows/nfl-static-review.yml']
  push:
    branches: [main]
    paths: ['tracks/nfl/**', '.github/workflows/nfl-static-review.yml']
permissions:
  contents: read
  pages: read
concurrency:
  group: nfl-static-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-and-pages-availability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify deterministic public bundle
        run: python tracks/nfl/build_dashboard_n088.py --check
      - name: Read actual GitHub Pages state without changing configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/nfl-static-evidence"
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          result={"configuration_mutated":False,"repository":os.environ['GITHUB_REPOSITORY']}
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  value=json.load(response)
                  result.update(http_status=response.status,status=value.get('status'),html_url=value.get('html_url'),build_type=value.get('build_type'),source=value.get('source'))
          except urllib.error.HTTPError as exc:
              result.update(http_status=exc.code,status='NOT_AVAILABLE_TO_WORKFLOW_TOKEN')
          except (OSError,TimeoutError) as exc:
              result.update(http_status=None,status='PROBE_FAILED',error_type=type(exc).__name__)
          result['public_url']='https://alvaromendizabal.github.io/sports-edge-lab/'
          try:
              with urllib.request.urlopen(result['public_url'],timeout=30) as response:
                  result['public_url_http_status']=response.status
          except urllib.error.HTTPError as exc:
              result['public_url_http_status']=exc.code
          except (OSError,TimeoutError) as exc:
              result['public_url_http_status']=None
              result['public_url_error_type']=type(exc).__name__
          path=Path(os.environ['RUNNER_TEMP'])/'nfl-static-evidence'/'github-pages-availability.json';path.write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
      - name: Install pinned verification browser
        run: |
          npm install --prefix "${RUNNER_TEMP}/nfl-static-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "${RUNNER_TEMP}/nfl-static-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test responsive paged games, lazy scores, detail clocks and script-free fallback
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nfl-static-browser/node_modules/playwright
          NFL_N088_EVIDENCE: ${{ runner.temp }}/nfl-static-evidence
        run: node tracks/nfl/dashboard_n088_browser.cjs
      - name: Record archived origin availability separately from current publication
        run: |
          python - <<'PY'
          import datetime, json, os, urllib.error, urllib.request
          from pathlib import Path
          results=[]
          for release,url in {
              'N088':'https://sports-edge-lab-nfl.alv-mendizabal.chatgpt.site/n088/',
              'Circa archive':'https://sports-edge-lab-nfl.alv-mendizabal.chatgpt.site/circa/',
          }.items():
              row={'release':release,'url':url,'role':'ARCHIVED_ORIGIN','gating':False}
              try:
                  with urllib.request.urlopen(url,timeout=20) as response:
                      row.update(http_status=response.status,availability='AVAILABLE' if response.status==200 else 'UNAVAILABLE')
              except urllib.error.HTTPError as exc:
                  row.update(http_status=exc.code,availability='UNAVAILABLE')
              except (OSError,TimeoutError) as exc:
                  row.update(http_status=None,availability='PROBE_FAILED',error_type=type(exc).__name__)
              results.append(row)
          record={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Availability observations only. Historical deployment receipts are not rewritten; the current publication has a separate mandatory live browser gate.','origins':results}
          out=Path(os.environ['RUNNER_TEMP'])/'nfl-static-evidence'/'archived-origin-availability.json'
          out.parent.mkdir(exist_ok=True,parents=True)
          out.write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record))
          PY
      - name: Verify the exact public dashboard emitted by the sealed N088 executable
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nfl-static-browser/node_modules/playwright
          NFL_N088_EVIDENCE: ${{ runner.temp }}/nfl-static-evidence/runtime
          NFL_N088_BUNDLE_ROOT: ${{ runner.temp }}/nfl-runtime-dashboard
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          source=Path('tracks/nfl')
          fixture=json.loads((source/'runtime_dashboard_n088_fixture.json').read_text())
          raw=gzip.decompress(base64.b64decode(fixture['html_gzip_base64']))
          assert len(raw)==fixture['html_bytes']<2000000
          assert hashlib.sha256(raw).hexdigest()==fixture['html_sha256']
          historical=(source/'dashboard_n088/historical.json').read_bytes()
          assert hashlib.sha256(historical).hexdigest()==fixture['historical_sha256']
          out=Path(os.environ['NFL_N088_BUNDLE_ROOT']);out.mkdir(exist_ok=True)
          (out/'index.html').write_bytes(raw)
          (out/'historical.json').write_bytes(historical)
          (out/'publication.json').write_text(json.dumps(fixture['publication']))
          print(json.dumps({'fixture':'actual sealed N088 executable output','html_sha256':fixture['html_sha256'],'source_run':fixture['source_run'],'new_model_fits':0}))
          PY
          node tracks/nfl/dashboard_n088_browser.cjs
      - name: Verify Circa public rendering and source immutability
        run: |
          python -m unittest discover -s tracks/nfl/circa_million_2026 -p test_current_n089.py -v
          node tracks/nfl/circa_million_2026/test_current_n089_dom.cjs
      - name: Verify responsive Circa cards, manual override, history and exact game drilldowns
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nfl-static-browser/node_modules/playwright
          CIRCA_N089_EVIDENCE: ${{ runner.temp }}/nfl-static-evidence/circa-source
        run: node tracks/nfl/circa_million_2026/test_current_n089_browser.cjs
      - name: Verify the sanitized projection of the preserved N089 runtime fixture
        if: always()
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nfl-static-browser/node_modules/playwright
          CIRCA_N089_EVIDENCE: ${{ runner.temp }}/nfl-static-evidence/circa-runtime
          CIRCA_N089_BUNDLE_ROOT: ${{ runner.temp }}/n089-runtime-dashboard
        run: |
          python - <<'PYFIXTURE'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          source=Path('tracks/nfl/circa_million_2026')
          fixture=json.loads((source/'runtime_dashboard_n089_fixture.json').read_text())
          raw=gzip.decompress(base64.b64decode(fixture['html_gzip_base64']))
          assert len(raw)==fixture['html_bytes']
          assert hashlib.sha256(raw).hexdigest()==fixture['html_sha256']
          history=base64.b64decode(fixture['history_gzip_base64'])
          assert hashlib.sha256(history).hexdigest()==fixture['history_gzip_sha256']
          evidence=(raw.decode().split('<script id="circa-data" type="application/json">')[1].split('</script>')[0]+'\n').encode()
          archive=(source/'current/archive/index.html').read_bytes()
          out=Path(os.environ['CIRCA_N089_BUNDLE_ROOT']);out.mkdir(exist_ok=True)
          for name,blob in {'index.html':raw,'history.json.gz':history,'evidence.json':evidence,'archive/index.html':archive}.items():
              assert hashlib.sha256(blob).hexdigest()==fixture['publication']['assets'][name]['sha256']
              dest=out/name;dest.parent.mkdir(exist_ok=True,parents=True);dest.write_bytes(blob)
          (out/'publication.json').write_text(json.dumps(fixture['publication'],indent=2,sort_keys=True)+'\n')
          print(json.dumps({'fixture':'privacy-sanitized N089 runtime projection','html_sha256':fixture['html_sha256'],'new_model_fits':0}))
          PYFIXTURE
          node tracks/nfl/circa_million_2026/test_current_n089_browser.cjs
      - name: Verify current published assets and real desktop and mobile interactions
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nfl-static-browser/node_modules/playwright
          NFL_CURRENT_EVIDENCE: ${{ runner.temp }}/nfl-static-evidence/current-online
          NFL_CURRENT_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tracks/nfl/current/validate_snapshot.py
          node tracks/nfl/current/test_live_browser.cjs
      - name: Verify N210 saved forecasts and phone board at both viewport sizes
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nfl-static-browser/node_modules/playwright
          NFL_CURRENT_EVIDENCE: ${{ runner.temp }}/nfl-static-evidence/n210-source
          NFL_N210_VERIFY_HOSTED: "1"
        run: node tracks/nfl/current/test_n210_browser.cjs
      - name: Verify N211 preserved issues, comparisons and phone board
        if: always()
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nfl-static-browser/node_modules/playwright
          NFL_CURRENT_EVIDENCE: ${{ runner.temp }}/nfl-static-evidence/n211-source
        run: node tracks/nfl/current/test_n211_browser.cjs
      - name: Preserve exact public bundle and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-publication-and-archive-evidence
          path: |
            ${{ runner.temp }}/nfl-static-evidence
            tracks/nfl/dashboard_n088
            tracks/nfl/circa_million_2026/current
            tracks/nfl/current
          if-no-files-found: error
          retention-days: 14

